name: Local Chat CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Signing Keystore
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LocalChat,O=AIStudio,C=US"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Prepare Release Asset Filename
        id: prepare_asset
        run: |
          RAW_VER="${GITHUB_REF_NAME:-v1.0.0}"
          if [[ "$RAW_VER" != v* ]]; then
            VER="v$RAW_VER"
          else
            VER="$RAW_VER"
          fi
          ASSET_NAME="LocalChat-${VER}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET_NAME"
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "asset_path=$ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-chat-release-apk
          path: ${{ steps.prepare_asset.outputs.asset_path || 'app/build/outputs/apk/release/app-release.apk' }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_asset.outputs.asset_path }}
          generate_release_notes: true
