name: Local Chat CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Prepare Release Asset Filename
        id: prepare_asset
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          ASSET_NAME="LocalChat-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_NAME"
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "asset_path=$ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-chat-debug-apk
          path: ${{ steps.prepare_asset.outputs.asset_path || 'app/build/outputs/apk/debug/*.apk' }}
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_asset.outputs.asset_path }}
          generate_release_notes: true
